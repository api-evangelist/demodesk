aid: demodesk
name: Demodesk
description: >-
  Demodesk is an AI Sales Agent platform for B2B revenue teams, founded in 2018 in
  Munich, Germany. Four AI agents (Assistant, Coach, Analyst, CRM Concierge) plus a
  custom AI Agent Builder record and transcribe sales conversations, generate summaries
  and scorecards, update CRMs (Salesforce, HubSpot, Pipedrive), coach reps, and flag
  at-risk deals. The company exposes a public REST API (v2, OpenAPI 3.1) for recordings,
  transcripts, AI summaries, scorecards, and users, authenticated with Bearer API keys,
  plus a webhook event surface for meeting and recording lifecycle events and an official
  hosted MCP server (OAuth2) at demodesk.com/mcp. GDPR-native with EU-only data residency
  (Azure Frankfurt) and ISO 27001:2022 certification.
