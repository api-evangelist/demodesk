x-notes:
  no_sdks_pointer: >-
    Deliberately NOT wired as `type: SDKs` in apis.yml. sdk_count is meant to read
    "does this provider ship a client library for its API" and the honest answer
    is no. Wiring a WebRTC streaming component and three consumer apps as SDKs
    would score a point the company has not earned. `type: Packages` is wired
    instead, which is what these actually are.
