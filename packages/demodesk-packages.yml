note: >-
  THE HEADLINE FINDING IS AN ABSENCE: Demodesk ships a public REST API (v2,
  OpenAPI 3.1) and a hosted MCP server, but publishes NO client SDK for either —
  not on npm, PyPI, RubyGems, Packagist, crates.io, Maven Central, NuGet or
  pkg.go.dev, and none is linked from the API reference. Every registry below was
  queried unauthenticated on 2026-08-14. What the company DOES publish under its
  own name are END-USER APPLICATIONS (a macOS/Windows recorder, an iOS/Android
  recorder, a Chrome extension) and one archived open-source streaming component
  inherited from an earlier product generation. Integrators are expected to call
  the API with a plain HTTP client, or to reach it through the MCP server — which
  is consistent with the company's own positioning ("connect once with your
  existing account"), but it means there is no versioned, dated first-party
  library whose staleness could be measured against the API.
