overlay: 1.0.0
info:
  title: API Evangelist enhancements for Demodesk Public API (v2)
  version: 1.0.0
extends: openapi/demodesk-v2-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-mcp: https://demodesk.com/mcp
    x-apievangelist-webhooks: asyncapi/demodesk-webhooks-asyncapi.yml
    x-apievangelist-conventions: conventions/demodesk-conventions.yml
    x-apievangelist-errors: errors/demodesk-problem-types.yml
- target: $.info
  update:
    x-apievangelist-pagination: cursor (meta.nextCursor / meta.hasNext / meta.limit)
    x-apievangelist-auth: bearer (API key or OAuth token); OAuth2 (mcp:tools) for MCP
