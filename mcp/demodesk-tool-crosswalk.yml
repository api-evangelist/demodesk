note: >-
  Unusually strong binding: Demodesk declares the MCP tool name ON the REST
  operation itself, via an `x-mcp` extension block (toolName, title,
  description, readOnlyHint/idempotentHint/destructiveHint/openWorldHint,
  timeoutMs) on all 8 v2 operations. The crosswalk is therefore not a
  name-similarity guess — the provider states the mapping in its own published
  contract, so every row is confidence: high. Each tool inherits the parameters
  and requestBody of its backing operation as its real inputSchema.
  The live tool list at https://demodesk.com/mcp is OAuth2-gated (401
  anonymous), so tool NAMES and hints come from the spec rather than from
  tools/list; a future authenticated introspection could confirm arity.
