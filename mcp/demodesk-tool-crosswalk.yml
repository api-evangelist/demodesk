x-drift:
  checked: '2026-08-14'
  source: https://demodesk.com/api/docs/v2/generated.yaml
  observed: >-
    Between the 2026-07-18 capture and 2026-08-14, Demodesk flipped
    `x-mcp.openWorldHint` from true to false on ALL EIGHT v2 operations — the
    only change in the entire spec. Nothing else moved: same 8 paths, same 10
    webhooks, same schemas, byte-identical v1. The hints in this crosswalk and in
    openapi/ have been resynced to the live contract. Semantically the provider
    is now telling agents these tools operate over a CLOSED world (the caller's
    own Demodesk tenant) rather than an open one — a correction that tightens how
    a client should reason about tool results, and a sign the x-mcp block is
    maintained rather than written once.
  provider_changelog: none published (https://demodesk.com/changelog -> 404)
