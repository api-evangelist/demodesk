note: >-
  Demodesk publishes rate limits inside the v2 OpenAPI itself — every operation's
  `description` carries a "Rate limits:" block. That makes the numbers
  provider-published rather than derived. The limits are enforced per API key.
  The 429 response declares a `Retry-After` header, so an agent is told how long
  to wait — but no RateLimit-* / X-RateLimit-* headers are declared, so remaining
  quota cannot be read before exhaustion, only after it.
